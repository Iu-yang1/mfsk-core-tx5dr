name: Temporary fork MSK DSP rustfmt (one-shot)
on:
  push:
    branches: [feature/tx5dr-msk40-adaptive-eq]
    paths:
      - '.github/workflows/tx5dr-autoformat-once.yml'
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only the changed MSK DSP modules and commit on this feature branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path Cargo.toml
          git add mfsk-core/src/msk144/msk40.rs mfsk-core/src/msk144/equalizer.rs \
            mfsk-core/src/msk144/mod.rs mfsk-core/src/msk144/decode.rs \
            mfsk-core/src/msk144/spd.rs mfsk-core/src/engine/dsp/analytic.rs
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(msk): apply rustfmt to fork DSP"
          git push origin HEAD:refs/heads/feature/tx5dr-msk40-adaptive-eq
